<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murach's Java Servlets and JSP - Survey</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <img src="logo_murach.png" alt="Murach Logo">
  </header>

  <main>
    <h1>Survey</h1>
    <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

    <form action="survey" method="post">
      <fieldset>
        <legend>Your information:</legend>

        <p>
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>
        </p>
        <p>
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>
        </p>
        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </p>
        <p>
          <label for="dateOfBirth">Date of Birth</label>
          <input type="date" id="dateOfBirth" name="dateOfBirth" placeholder="Enter your date of birth">
        </p>
      </fieldset>

      <fieldset>
        <legend>How did you hear about us?</legend>
        <label><input type="radio" name="heardFrom" value="Search engine" checked> Search engine</label>
        <label><input type="radio" name="heardFrom" value="Word of mouth"> Word of mouth</label>
        <label><input type="radio" name="heardFrom" value="Social Media"> Social Media</label>
        <label><input type="radio" name="heardFrom" value="Other"> Other</label>
      </fieldset>

      <fieldset>
        <legend>Would you like to receive announcements about new CDs and special offers?</legend>
        <label><input type="checkbox" name="announcements" value="yes"> YES, I'd like that.</label>
        <label><input type="checkbox" name="emailAnnouncements" value="yes"> YES, please send me email announcements.</label>
      </fieldset>

      <p>
        <label for="contactVia">Please contact me by:</label>
        <select id="contactVia" name="contactVia">
          <option>Email or postal mail</option>
          <option>Email only</option>
          <option>Postal mail only</option>
        </select>
      </p>

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
